// Where Gradle downloads plugins and libraries from.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'DropZone-android'
include ':app'        // DropZone
include ':dropcast'   // DropCast, the single-file share app (PLAN.md > M2)
